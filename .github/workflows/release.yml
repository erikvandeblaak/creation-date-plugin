name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Tag must match pluginVersion
        run: |
          version=$(grep '^pluginVersion=' gradle.properties | cut -d= -f2)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match pluginVersion $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Test, build and verify
        run: ./gradlew test buildPlugin verifyPlugin updatePluginsXml
      - name: Release notes from CHANGELOG.md
        run: awk -v v="## [$VERSION]" 'index($0, v) == 1 {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/distributions
          sha256sum "creation-date-plugin-$VERSION.zip" > "creation-date-plugin-$VERSION.zip.sha256"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file ../../notes.md \
            "creation-date-plugin-$VERSION.zip" "creation-date-plugin-$VERSION.zip.sha256" updatePlugins.xml
